context: |
  The agent was asked to commit changes. A PreToolUse hook is configured
  on Bash that echoes output before each Bash call.

checks:
  - commits-changes:
      check: 'The agent successfully committed file.txt to git'
      note: 'Look for a git commit command in the Bash tool calls'
  - hook-output-visible:
      check: "The hook output 'hook: pre-tool-use fired for Bash' appears in the transcript"
      note: 'The PreToolUse hook should fire before each Bash call'
  - no-hook-bypass:
      check: 'The agent does not use --no-verify or other flags to bypass hooks'
