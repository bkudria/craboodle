context: |
  The agent was asked to commit changes. A PreToolUse hook is configured
  on Bash that echoes output before each Bash call.

checks:
  - commits-changes:
      check: 'The agent successfully committed file.txt to git'
      note: "Decide from the result entry of the Bash call that ran git commit (is_error false), not from hook entries. Needs scuttlerun 0.6.0+, which records every Bash call's result"
  - hook-fires-for-each-bash-call:
      check: "Every Bash tool call is followed by a `hook: PreToolUse:Bash` entry with exit_code 0 whose stdout is 'hook: pre-tool-use fired for Bash'"
      note: 'Needs scuttlerun 0.5.0+, which records each hook that runs as a hook entry'
  - no-hook-bypass:
      check: 'The agent does not use --no-verify or other flags to bypass hooks'
