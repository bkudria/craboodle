prompt: |
  I've made changes to file.txt. Please commit them to git.
tools:
  - Read
  - Write
  - Bash
  - Glob
  - Grep
project:
  git_init: true
  files:
    file.txt: 'updated content'
  # NOTE: PreToolUse hooks may not fire in all Agent SDK modes.
  # Verify this scenario works in your scuttlerun environment before
  # relying on hook-dependent checks.
  settings:
    hooks:
      PreToolUse:
        - matcher: Bash
          hooks:
            - type: command
              command: "echo 'hook: pre-tool-use fired for Bash'"
